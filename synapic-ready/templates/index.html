<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06131c">
  <meta name="description" content="Synapic — OCR، ترجمه، خوانش و خروجی متن">
  <title>Synapic</title>
  <link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="backdrop"></div>
  <main class="shell">
    <header class="topbar glass">
      <a class="brand" href="#" aria-label="Synapic">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="img">
            <path d="M13 10h16c6 0 9 3 9 7s-3 7-8 7H20c-3 0-5 2-5 5s2 5 6 5h13"/>
            <circle cx="13" cy="10" r="2.3"/><circle cx="38" cy="17" r="2.3"/><circle cx="15" cy="34" r="2.3"/>
            <path d="M7 38h11"/>
          </svg>
        </span>
        <span class="brand-text">Synapic</span>
      </a>
      <div class="top-actions">
        <button class="icon-btn" id="themeToggle" title="تغییر تم" aria-label="تغییر تم">◐</button>
        <button class="icon-btn" id="settingsToggle" title="تنظیمات" aria-label="تنظیمات">⚙</button>
      </div>
    </header>

    <section class="workspace">
      <aside class="control-panel glass">
        <div class="panel-heading">
          <div>
            <span class="eyebrow" data-i18n="source">متن</span>
            <h1 data-i18n="workspace">استخراج و ترجمه</h1>
          </div>
          <span class="status-dot" id="statusDot" aria-hidden="true"></span>
        </div>

        <label class="dropzone" id="dropzone" for="fileInput">
          <input id="fileInput" type="file" accept="image/*,.pdf" hidden>
          <span class="upload-orb">↥</span>
          <span class="drop-title" data-i18n="uploadTitle">تصویر یا PDF را بارگذاری کنید</span>
          <span class="drop-sub" data-i18n="uploadSub">PNG · JPG · WEBP · PDF</span>
          <span class="file-name" id="fileName"></span>
        </label>

        <div class="field-grid">
          <label class="field">
            <span data-i18n="ocrLang">زبان متن</span>
            <select id="ocrLanguage">
              <option value="fa">فارسی</option>
              <option value="en">English</option>
              <option value="zh">中文</option>
            </select>
          </label>
          <label class="field">
            <span data-i18n="targetLang">ترجمه به</span>
            <select id="targetLanguage">
              <option value="en">English</option>
              <option value="fa">فارسی</option>
              <option value="zh">中文</option>
            </select>
          </label>
        </div>

        <button class="primary-btn" id="extractBtn" disabled>
          <span data-i18n="extract">استخراج متن</span>
          <span class="btn-arrow">↗</span>
        </button>

        <div class="progress-wrap hidden" id="progressWrap">
          <div class="progress-head"><span id="progressLabel">—</span><span id="progressPct">0%</span></div>
          <div class="progress-track"><span id="progressBar"></span></div>
        </div>

        <div class="tool-row">
          <button class="ghost-btn" id="translateBtn" disabled><span data-i18n="translate">ترجمه</span></button>
          <button class="ghost-btn" id="speakOriginalBtn" disabled><span data-i18n="speakOriginal">خواندن اصلی</span></button>
          <button class="ghost-btn" id="speakTranslatedBtn" disabled><span data-i18n="speakTranslated">خواندن ترجمه</span></button>
        </div>

        <div class="export-card">
          <div class="export-title" data-i18n="export">خروجی</div>
          <div class="export-grid">
            <button class="export-btn" data-format="pdf">PDF</button>
            <button class="export-btn" data-format="docx">DOCX</button>
            <button class="export-btn" data-format="md">MD</button>
            <button class="export-btn" data-format="txt">TXT</button>
          </div>
        </div>
      </aside>

      <section class="editor-panel glass">
        <div class="editor-head">
          <div class="tabs" role="tablist">
            <button class="tab active" data-tab="original" data-i18n="original">متن اصلی</button>
            <button class="tab" data-tab="translated" data-i18n="translated">ترجمه</button>
          </div>
          <div class="meta-strip">
            <span id="pageMeta">0 صفحه</span>
            <span class="meta-sep">·</span>
            <span id="confidenceMeta">0%</span>
          </div>
        </div>
        <div class="editor-body">
          <textarea id="originalText" class="editor active" spellcheck="false" placeholder=""></textarea>
          <textarea id="translatedText" class="editor" spellcheck="false" placeholder=""></textarea>
          <div class="empty-state" id="emptyState">
            <div class="empty-icon">
              <svg viewBox="0 0 56 56" aria-hidden="true"><path d="M14 8h28l8 8v32H14z"/><path d="M42 8v10h10M21 28h22M21 36h22M21 44h14"/></svg>
            </div>
          </div>
        </div>
        <div class="editor-foot">
          <span id="charCount">0 کاراکتر</span>
          <span id="liveState"></span>
        </div>
      </section>
    </section>
  </main>

  <dialog class="settings glass" id="settingsDialog">
    <form method="dialog" class="settings-inner">
      <div class="settings-head">
        <h2 data-i18n="settings">تنظیمات</h2>
        <button class="icon-btn" value="cancel" aria-label="بستن">×</button>
      </div>
      <label class="field">
        <span data-i18n="uiLanguage">زبان سایت</span>
        <select id="uiLanguage">
          <option value="fa">فارسی</option>
          <option value="en">English</option>
          <option value="zh">中文</option>
        </select>
      </label>
      <label class="field">
        <span data-i18n="theme">تم</span>
        <select id="themeSelect">
          <option value="system" data-i18n="system">سیستم</option>
          <option value="dark" data-i18n="dark">دارک</option>
          <option value="light" data-i18n="light">لایت</option>
        </select>
      </label>
      <button class="primary-btn settings-save" id="saveSettings" value="default" data-i18n="save">ذخیره</button>
    </form>
  </dialog>

  <div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="true"></div>
  <script src="/static/js/app.js"></script>
</body>
</html>
